<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특별실 예약 관리</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 캐시 방지: 배포 후에도 브라우저가 구버전 CSS/JS를 들고 있는 경우가 많아 버전 쿼리를 붙입니다 -->
    <link rel="stylesheet" href="styles.css?v=20260701-1">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto px-4 py-6">
        <!-- 상단 컨트롤 바 -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-4">
            <div class="flex items-center justify-between flex-wrap gap-4">
                <!-- 날짜 네비게이션 -->
                <div class="flex items-center gap-2">
                    <button id="prevWeek" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded text-xl font-extrabold leading-none">
                        ←
                    </button>
                    <select id="weekSelector" class="px-3 py-1 border rounded">
                        <!-- 동적으로 생성 -->
                    </select>
                    <button id="nextWeek" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded text-xl font-extrabold leading-none">
                        →
                    </button>
                    <button id="goToday" class="px-3 py-2 bg-gray-900 text-white rounded hover:bg-gray-800 text-sm font-semibold">
                        오늘로
                    </button>
                </div>


                <!-- 기능 버튼 -->
                <div class="flex items-center gap-2">
                    <button id="viewMyReservations" class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm font-medium">
                        내예약보기
                    </button>
                    <!-- 서버 연동 관련 버튼 3개는 같은 계열(인디고) 색으로 묶어서 "한 그룹"임을 보여줍니다 -->
                    <button id="serverConfigBtn" class="px-3 py-1 bg-indigo-400 text-white rounded hover:bg-indigo-500 text-sm font-medium">
                        서버 설정
                    </button>
                    <button id="syncToSheetsBtn" class="px-3 py-1 bg-indigo-600 text-white rounded hover:bg-indigo-700 text-sm font-medium">
                        서버로 저장
                    </button>
                    <button id="syncFromSheetsBtn" class="px-3 py-1 bg-indigo-500 text-white rounded hover:bg-indigo-600 text-sm font-medium">
                        서버에서 불러오기
                    </button>
                </div>
            </div>
        </div>

        <!-- 특별실 탭 영역 -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-4">
            <div class="flex items-center gap-2 flex-wrap">
                <div id="roomTabs" class="flex gap-2 flex-wrap">
                    <!-- 동적으로 생성 -->
                </div>
                <button id="addRoomBtn" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
                    + 특별실 추가
                </button>
            </div>
        </div>

        <!-- 시간표 격자 -->
        <div class="bg-white rounded-lg shadow-md p-4 overflow-x-auto">
            <div id="scheduleTitle" class="text-lg font-semibold text-gray-800 mb-3 flex items-start justify-between gap-3">
                <div id="scheduleTitleText">특별실을 선택하세요</div>
                <!-- 우측 여백 워터마크(기본 배정 시간 등) -->
                <div id="scheduleTitleHint" class="text-xs text-gray-500 opacity-50 text-right whitespace-pre-line select-none"></div>
            </div>
            <table id="scheduleTable" class="w-full border-collapse">
                <thead>
                    <tr>
                        <th class="border p-2 bg-gray-100 w-44">교시/시간</th>
                        <th id="monday" class="border p-2 bg-gray-100">월</th>
                        <th id="tuesday" class="border p-2 bg-gray-100">화</th>
                        <th id="wednesday" class="border p-2 bg-gray-100">수</th>
                        <th id="thursday" class="border p-2 bg-gray-100">목</th>
                        <th id="friday" class="border p-2 bg-gray-100">금</th>
                    </tr>
                </thead>
                <tbody id="scheduleBody">
                    <!-- 동적으로 생성 (1~10교시) -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 예약 모달 -->
    <div id="reservationModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4">
            <h2 id="modalTitle" class="text-xl font-bold mb-4">예약하기</h2>
            <form id="reservationForm">
                <input type="hidden" id="reservationId">
                <input type="hidden" id="reservationDate">
                <input type="hidden" id="reservationPeriod">
                <input type="hidden" id="reservationRoomId">

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">예약자명</label>
                    <input type="text" id="reservationName" class="w-full px-3 py-2 border rounded" required>
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">학급</label>
                    <input type="text" id="reservationClass" class="w-full px-3 py-2 border rounded" placeholder="예: 6-1">
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">목적</label>
                    <input type="text" id="reservationPurpose" class="w-full px-3 py-2 border rounded" placeholder="예: 실험 수업">
                </div>

                <!-- 연속/반복 예약 설정: 새 예약을 만들 때만 표시(수정 시에는 숨김) -->
                <div id="repeatOptions" class="mb-4 border-t pt-3">
                    <div class="text-sm font-medium mb-2">연속/반복 예약(선택)</div>
                    <div id="consecutiveSlotsBox" class="mb-3 text-sm">
                        <div class="text-xs text-gray-600 mb-1">같은 날 이어서 예약할 교시</div>
                        <div id="consecutiveSlotsList" class="flex flex-wrap gap-2">
                            <!-- 동적으로 생성 -->
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs text-gray-600" for="reservationRepeatWeeks">매주 반복(주 수, 1=반복 안 함)</label>
                        <input type="number" id="reservationRepeatWeeks" min="1" max="20" value="1"
                               class="w-16 px-2 py-1 border rounded text-sm">
                    </div>
                </div>

                <div class="flex gap-2 justify-end">
                    <button type="button" id="deleteReservationBtn" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600 hidden">
                        삭제
                    </button>
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                        취소
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                        저장
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 특별실 추가 모달 -->
    <div id="addRoomModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4">
            <h2 class="text-xl font-bold mb-4">특별실 추가</h2>
            <form id="addRoomForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">특별실 이름</label>
                    <input type="text" id="roomName" class="w-full px-3 py-2 border rounded" placeholder="예: 과학실" required>
                </div>
                <div class="flex gap-2 justify-end">
                    <button type="button" id="cancelRoomModalBtn" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                        취소
                    </button>
                    <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600">
                        추가
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 특별실 수정 모달 -->
    <div id="editRoomModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 w-full max-w-md mx-4">
            <h2 class="text-xl font-bold mb-4">특별실 이름 수정</h2>
            <form id="editRoomForm">
                <input type="hidden" id="editRoomId">
                <div class="mb-4">
                    <label class="block text-sm font-medium mb-1">특별실 이름</label>
                    <input type="text" id="editRoomName" class="w-full px-3 py-2 border rounded" required>
                </div>
                <div class="flex gap-2 justify-end">
                    <button type="button" id="cancelEditRoomModalBtn" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">
                        취소
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                        수정
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 스크립트 로드 -->
    <!--
      서버(Supabase) 접속 정보를 "기본값으로 고정"하고 싶으면 여기만 1번 설정하면 됩니다.
      - 이후 다른 사용자들은 별도 설정 없이 바로 사용 가능
      - 필요하면 URL 쿼리로도 주입 가능: ?supabaseUrl=...&supabaseKey=...

      아래 값을 실제 Supabase 프로젝트 URL/publishable key로 바꿔주세요.
      (publishable/anon key는 클라이언트에 노출돼도 되는 공개 키입니다. service_role 키는 절대 넣지 마세요.)
    -->
    <script>
        // 기본 Supabase 프로젝트 접속 정보(배포 고정)
        window.APP_DEFAULT_SUPABASE_URL = window.APP_DEFAULT_SUPABASE_URL || 'https://ewvwlowxgtnnmlvzblxt.supabase.co';
        window.APP_DEFAULT_SUPABASE_KEY = window.APP_DEFAULT_SUPABASE_KEY || 'sb_publishable_XhhGg5y5hv1xRXGImMCjgg_9mJpaSnB';

        // true면 설정 모달에서 URL/key를 변경하지 못하게 잠금(권장: 실사용 배포에서 true)
        window.APP_LOCK_SERVER_URL = true;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/utils.js?v=20260701-1"></script>
    <script src="js/storage.js?v=20260701-1"></script>
    <script src="js/supabaseSync.js?v=20260701-1"></script>
    <script src="js/app.js?v=20260701-1"></script>
</body>
</html>
